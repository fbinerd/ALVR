# Run this workflow from master, then choose the ALVR source branch to build.
# Same steps as ALVR's build.yml, which only runs on pull requests; nothing
# here runs on push or on a schedule.
name: Manual build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "ALVR source branch, tag, or commit to build"
        type: string
        default: master
        required: true
      linux:
        description: "Linux streamer and launcher"
        type: boolean
        default: true
      windows:
        description: "Windows streamer and launcher"
        type: boolean
        default: false
      android:
        description: "Android client (APK)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          submodules: true

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow

      - name: Record selected source revision
        id: source
        shell: bash
        working-directory: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          safe_ref="$(printf '%s' "$SOURCE_REF" | sed -E 's/[^[:alnum:]_.-]+/-/g' | cut -c1-64)"
          artifact_suffix="${safe_ref}-${source_sha:0:12}"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/alvr-build-source.txt" <<EOF
          Workflow ref: $GITHUB_REF
          Workflow commit: $GITHUB_SHA
          Selected source ref: $SOURCE_REF
          Source commit: $source_sha
          Launcher patch: $GITHUB_SHA:.github/patches/launcher-local-build.patch
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          cat "$RUNNER_TEMP/alvr-build-source.txt"
          {
            echo '### Build source'
            echo
            echo "- Workflow: \`$GITHUB_REF\` (\`$GITHUB_SHA\`)"
            echo "- Selected source: \`$SOURCE_REF\`"
            echo "- Commit: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential pkg-config nasm libva-dev libdrm-dev libvulkan-dev libx264-dev libasound2-dev libxrandr-dev libunwind-dev libgtk-3-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Prepare deps
        working-directory: source
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform linux

      - name: Build and package ALVR Linux bundle (.tar.xz)
        working-directory: source
        env:
          RUST_BACKTRACE: 1
        run: |
          set -e
          mkdir -p artifacts/alvr_linux_bundle/build
          git apply --check ../workflow/.github/patches/launcher-local-build.patch
          git apply ../workflow/.github/patches/launcher-local-build.patch
          cargo xtask build-streamer --platform linux --ci --release
          ALVR_LOCAL_BUILD=1 cargo xtask build-launcher --platform linux --ci --release
          cp -a build/alvr_streamer_linux artifacts/alvr_linux_bundle/build/
          cp -a build/alvr_launcher_linux artifacts/alvr_linux_bundle/build/
          tar -cJf artifacts/alvr_linux_bundle.tar.xz -C artifacts alvr_linux_bundle
          cp "$RUNNER_TEMP/alvr-build-source.txt" artifacts/build-source.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Linux bundle - ${{ steps.source.outputs.artifact_suffix }}
          path: ./source/artifacts/*

  build-windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          submodules: true

      - name: Record selected source revision
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          safe_ref="$(printf '%s' "$SOURCE_REF" | sed -E 's/[^[:alnum:]_.-]+/-/g' | cut -c1-64)"
          artifact_suffix="${safe_ref}-${source_sha:0:12}"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/alvr-build-source.txt" <<EOF
          Workflow ref: $GITHUB_REF
          Workflow commit: $GITHUB_SHA
          Selected source ref: $SOURCE_REF
          Source commit: $source_sha
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          cat "$RUNNER_TEMP/alvr-build-source.txt"
          {
            echo '### Build source'
            echo
            echo "- Workflow: \`$GITHUB_REF\` (\`$GITHUB_SHA\`)"
            echo "- Selected source: \`$SOURCE_REF\`"
            echo "- Commit: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install zip unzip pkgconfiglite

      - name: Prepare deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform windows

      - name: Build and package ALVR (.zip)
        env:
          RUST_BACKTRACE: 1
        run: |
          mkdir artifacts/
          cargo xtask build-streamer --platform windows --ci
          zip -r9X artifacts/alvr_streamer_windows.zip ./build/alvr_streamer*
          cargo xtask build-launcher --platform windows --ci
          zip -r9X artifacts/alvr_launcher_windows.zip ./build/alvr_launcher*
          cp "$RUNNER_TEMP/alvr-build-source.txt" artifacts/build-source.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows packages - ${{ steps.source.outputs.artifact_suffix }}
          path: ./artifacts/*

  build-android:
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          submodules: true

      - name: Record selected source revision
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          safe_ref="$(printf '%s' "$SOURCE_REF" | sed -E 's/[^[:alnum:]_.-]+/-/g' | cut -c1-64)"
          artifact_suffix="${safe_ref}-${source_sha:0:12}"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/alvr-build-source.txt" <<EOF
          Workflow ref: $GITHUB_REF
          Workflow commit: $GITHUB_SHA
          Selected source ref: $SOURCE_REF
          Source commit: $source_sha
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          cat "$RUNNER_TEMP/alvr-build-source.txt"
          {
            echo '### Build source'
            echo
            echo "- Workflow: \`$GITHUB_REF\` (\`$GITHUB_SHA\`)"
            echo "- Selected source: \`$SOURCE_REF\`"
            echo "- Commit: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-32"

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Prepare deps
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask prepare-deps --platform android

      - name: Build client
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        working-directory: ./alvr/client_openxr
        run: cargo xtask build-client

      - name: Add build source to APK artifact
        run: cp "$RUNNER_TEMP/alvr-build-source.txt" ./build/alvr_client_android/build-source.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Android APK - ${{ steps.source.outputs.artifact_suffix }}
          path: |
            ./build/alvr_client_android/alvr_client_android.apk
            ./build/alvr_client_android/build-source.txt
